# ################################
# Model: SepFormer for source separation
# https://arxiv.org/abs/2010.13154
# Dataset : LRS2-2Mix
# ################################
#
# Basic parameters
# Seed needs to be set at top of yaml, before objects with parameters are made
#
seed: 1234
__set_seed: !apply:torch.manual_seed [!ref <seed>]

eval_only: false
# Reuse the existing CSV loader; LRS2 has no automatic preparation yet.
# skip_prep must remain True when using this compatibility dataset selector.
dataset: wsj0mix

# Data params

# Root of the extracted LRS2-2Mix audio (16 kHz).
# The prebuilt CSVs below contain absolute paths to these WAVs.
data_folder: /project/anhlt/lab-ss/LRS2-2mix/lrs2_rebuild/audio

# Unused for static LRS2-2Mix mixtures.
base_folder_dm: null

project: Mamba-TasNet
experiment: sepformer
output_folder: !ref results/LRS2/<experiment>/<seed>
train_log: !ref <output_folder>/train_log.txt
save_folder: !ref <output_folder>/save
# Reuse prebuilt SpeechBrain CSVs without writing to their directory.
# Required columns: ID, duration, mix_wav, s1_wav, s2_wav.
train_data: /project/anhlt/lab-ss/LongHorn-TasNet-V2/results/LRS/LRS2-S-V1-16k/2406/save/lrs2_tr.csv
valid_data: /project/anhlt/lab-ss/LongHorn-TasNet-V2/results/LRS/LRS2-S-V1-16k/2406/save/lrs2_cv.csv
test_data: /project/anhlt/lab-ss/LongHorn-TasNet-V2/results/LRS/LRS2-S-V1-16k/2406/save/lrs2_tt.csv
skip_prep: True


# Experiment params
precision: True # bf16, fp16 or fp32 # Set it to True for mixed precision
num_spks: 2 # LRS2-2Mix
noprogressbar: False
save_audio: True # Save estimated sources on disk
n_audio_to_save: 20
sample_rate: 16000

# Training parameters
N_epochs: 200
batch_size: 1
lr: 0.00015
clip_grad_norm: 5
loss_upper_lim: 999999  # this is the upper limit for an acceptable loss
# if True, the training sequences are cut to a specified length
limit_training_signal_len: True
# this is the length of sequences if we choose to limit
# the signal length of training sequences
training_signal_len: 64000 # 4 seconds at 16 kHz

# Set it to True to dynamically create mixtures at training time
dynamic_mixing: False

# Parameters for data augmentation
use_wavedrop: False
use_speedperturb: True
use_rand_shift: False
min_shift: -8000
max_shift: 8000

# Speed perturbation
speed_changes: [95, 100, 105]  # List of speed changes for time-stretching

speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: !ref <speed_changes>

# Frequency drop: randomly drops a number of frequency bands to zero.
drop_freq_low: 0  # Min frequency band dropout probability
drop_freq_high: 1  # Max frequency band dropout probability
drop_freq_count_low: 1  # Min number of frequency bands to drop
drop_freq_count_high: 3  # Max number of frequency bands to drop
drop_freq_width: 0.05  # Width of frequency bands to drop

drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: !ref <drop_freq_low>
    drop_freq_high: !ref <drop_freq_high>
    drop_freq_count_low: !ref <drop_freq_count_low>
    drop_freq_count_high: !ref <drop_freq_count_high>
    drop_freq_width: !ref <drop_freq_width>

# Time drop: randomly drops a number of temporal chunks.
drop_chunk_count_low: 1  # Min number of audio chunks to drop
drop_chunk_count_high: 5  # Max number of audio chunks to drop
drop_chunk_length_low: 1000  # Min length of audio chunks to drop
drop_chunk_length_high: 2000  # Max length of audio chunks to drop

drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: !ref <drop_chunk_length_low>
    drop_length_high: !ref <drop_chunk_length_high>
    drop_count_low: !ref <drop_chunk_count_low>
    drop_count_high: !ref <drop_chunk_count_high>

# loss thresholding -- this thresholds the training loss
threshold_byloss: True
threshold: -30

# Encoder parameters
N_encoder_out: 256
out_channels: 256
kernel_size: 16
kernel_stride: 8

# Dataloader options
# Set num_workers: 0 on MacOS due to behavior of the multiprocessing library
dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: 3


# Specifying the network
Encoder: !new:speechbrain.lobes.models.dual_path.Encoder
    kernel_size: !ref <kernel_size>
    out_channels: !ref <N_encoder_out>


SBtfintra: !new:speechbrain.lobes.models.dual_path.SBTransformerBlock
    num_layers: 8
    d_model: !ref <out_channels>
    nhead: 8
    d_ffn: 1024
    dropout: 0
    use_positional_encoding: True
    norm_before: True

SBtfinter: !new:speechbrain.lobes.models.dual_path.SBTransformerBlock
    num_layers: 8
    d_model: !ref <out_channels>
    nhead: 8
    d_ffn: 1024
    dropout: 0
    use_positional_encoding: True
    norm_before: True

MaskNet: !new:speechbrain.lobes.models.dual_path.Dual_Path_Model
    num_spks: !ref <num_spks>
    in_channels: !ref <N_encoder_out>
    out_channels: !ref <out_channels>
    num_layers: 2
    K: 250
    intra_model: !ref <SBtfintra>
    inter_model: !ref <SBtfinter>
    norm: ln
    linear_layer_after_inter_intra: False
    skip_around_intra: True

Decoder: !new:speechbrain.lobes.models.dual_path.Decoder
    in_channels: !ref <N_encoder_out>
    out_channels: 1
    kernel_size: !ref <kernel_size>
    stride: !ref <kernel_stride>
    bias: False

# Training-only masked JEPA on the SepFormer encoder latents.
jepa_weight: 0.1
jepa_mask_ratio: 0.5
jepa_mask_span: 16
jepa_context_layers: 1
jepa_predictor_layers: 1
jepa_predictor_dim: 128
jepa_momentum: 0.996
jepa_momentum_end: 1.0
jepa_anneal_steps: !ref <N_epochs> * (20000 // <batch_size>)
JEPAContext: !new:modules.mamba_blocks.MambaBlocksSequential
    n_mamba: !ref <jepa_context_layers>
    bidirectional: True
    d_model: !ref <N_encoder_out>
    d_state: 16
    expand: 2
    d_conv: 4
    fused_add_norm: False
    rms_norm: True
    residual_in_fp32: False
JEPAPredictor: !new:modules.mamba_blocks.MambaBlocksSequential
    n_mamba: !ref <jepa_predictor_layers>
    bidirectional: True
    d_model: !ref <jepa_predictor_dim>
    d_state: 16
    expand: 2
    d_conv: 4
    fused_add_norm: False
    rms_norm: True
    residual_in_fp32: False
JEPA: !new:modules.jepa.MaskedSourceJEPA
    encoder: !ref <Encoder>
    context_model: !ref <JEPAContext>
    predictor_model: !ref <JEPAPredictor>
    channels: !ref <N_encoder_out>
    predictor_dim: !ref <jepa_predictor_dim>
    mask_ratio: !ref <jepa_mask_ratio>
    mask_span: !ref <jepa_mask_span>
    momentum: !ref <jepa_momentum>
    momentum_end: !ref <jepa_momentum_end>
    anneal_steps: !ref <jepa_anneal_steps>

optimizer: !name:torch.optim.Adam
    lr: !ref <lr>
    weight_decay: 0

loss: !name:speechbrain.nnet.losses.get_si_snr_with_pitwrapper

lr_scheduler: !new:speechbrain.nnet.schedulers.ReduceLROnPlateau
    factor: 0.5
    patience: 2
    dont_halve_until_epoch: 85

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <N_epochs>

modules:
    encoder: !ref <Encoder>
    decoder: !ref <Decoder>
    masknet: !ref <MaskNet>
    jepa: !ref <JEPA>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        encoder: !ref <Encoder>
        decoder: !ref <Decoder>
        masknet: !ref <MaskNet>
        jepa: !ref <JEPA>
        # counter: !ref <epoch_counter>
        # lr_scheduler: !ref <lr_scheduler>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

use_wandb: true
resume: false
wandb_logger: !name:speechbrain.utils.train_logger.WandBLogger
    initializer: !name:wandb.init
    entity: xj-audio
    project: !ref <project>
    name: !ref <experiment>
    dir: !ref <save_folder>
    reinit: true
    resume: !ref <resume>

