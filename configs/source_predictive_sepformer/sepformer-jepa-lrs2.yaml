# Source-predictive SepFormer for two-speaker LRS2 separation.
# The clean-source encoder and predictor are training-only modules.

seed: 1234
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

data_folder: /project/anhlt/lab-ss/LRS2-2mix/lrs2_rebuild/audio
type_data: lrs2
base_folder_dm: /project/anhlt/LibriMix/LibriSpeech/train-clean-100/

experiment_name: sepformer-jepa-lrs2
output_folder: !ref results/<experiment_name>-train100/<seed>
train_log: !ref <output_folder>/train_log.txt
save_folder: !ref <output_folder>/save
train_data: !ref <save_folder>/lrs2_tr.csv
valid_data: !ref <save_folder>/lrs2_cv.csv
test_data: !ref <save_folder>/lrs2_tt.csv
skip_prep: False
ckpt_interval_minutes: 60

precision: fp32
num_spks: 2
noprogressbar: False
save_audio: False
sample_rate: 8000

N_epochs: 200
batch_size: 3
lr: 0.00015
clip_grad_norm: 5
loss_upper_lim: 999999
limit_training_signal_len: True
training_signal_len: 32000

dynamic_mixing: False
use_wham_noise: False
use_wavedrop: False
use_speedperturb: True
use_rand_shift: False
min_shift: -8000
max_shift: 8000
speed_changes: [95, 100, 105]

speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: !ref <speed_changes>

drop_freq_low: 0
drop_freq_high: 1
drop_freq_count_low: 1
drop_freq_count_high: 3
drop_freq_width: 0.05

drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: !ref <drop_freq_low>
    drop_freq_high: !ref <drop_freq_high>
    drop_freq_count_low: !ref <drop_freq_count_low>
    drop_freq_count_high: !ref <drop_freq_count_high>
    drop_freq_width: !ref <drop_freq_width>

drop_chunk_count_low: 1
drop_chunk_count_high: 5
drop_chunk_length_low: 1000
drop_chunk_length_high: 2000

drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: !ref <drop_chunk_length_low>
    drop_length_high: !ref <drop_chunk_length_high>
    drop_count_low: !ref <drop_chunk_count_low>
    drop_count_high: !ref <drop_chunk_count_high>

threshold_byloss: True
threshold: -30

N_encoder_out: 256
out_channels: 256
kernel_size: 16
kernel_stride: 8
d_ffn: 1024
predictor_hidden_channels: 256
source_prediction_weight: 0.1
target_encoder_momentum: 0.999

dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: 0

Encoder: !new:speechbrain.lobes.models.dual_path.Encoder
    kernel_size: !ref <kernel_size>
    out_channels: !ref <N_encoder_out>

TargetEncoder: !new:speechbrain.lobes.models.dual_path.Encoder
    kernel_size: !ref <kernel_size>
    out_channels: !ref <N_encoder_out>

SBtfintra: !new:speechbrain.lobes.models.dual_path.SBTransformerBlock
    num_layers: 8
    d_model: !ref <out_channels>
    nhead: 8
    d_ffn: !ref <d_ffn>
    dropout: 0
    use_positional_encoding: True
    norm_before: True

SBtfinter: !new:speechbrain.lobes.models.dual_path.SBTransformerBlock
    num_layers: 8
    d_model: !ref <out_channels>
    nhead: 8
    d_ffn: !ref <d_ffn>
    dropout: 0
    use_positional_encoding: True
    norm_before: True

MaskNet: !new:speechbrain.lobes.models.dual_path.Dual_Path_Model
    num_spks: !ref <num_spks>
    in_channels: !ref <N_encoder_out>
    out_channels: !ref <out_channels>
    num_layers: 2
    K: 250
    intra_model: !ref <SBtfintra>
    inter_model: !ref <SBtfinter>
    norm: ln
    linear_layer_after_inter_intra: False
    skip_around_intra: True

Decoder: !new:speechbrain.lobes.models.dual_path.Decoder
    in_channels: !ref <N_encoder_out>
    out_channels: 1
    kernel_size: !ref <kernel_size>
    stride: !ref <kernel_stride>
    bias: False

SourcePredictor: !new:models.SourceLatentPredictor
    channels: !ref <N_encoder_out>
    hidden_channels: !ref <predictor_hidden_channels>

source_prediction_loss: !new:models.NormalizedSourcePredictionLoss

optimizer: !name:torch.optim.Adam
    lr: !ref <lr>
    weight_decay: 0

loss: !name:speechbrain.nnet.losses.get_si_snr_with_pitwrapper

lr_scheduler: !new:speechbrain.nnet.schedulers.ReduceLROnPlateau
    factor: 0.5
    patience: 2
    dont_halve_until_epoch: 5

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <N_epochs>

modules:
    encoder: !ref <Encoder>
    decoder: !ref <Decoder>
    masknet: !ref <MaskNet>
    source_predictor: !ref <SourcePredictor>
    target_encoder: !ref <TargetEncoder>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        encoder: !ref <Encoder>
        decoder: !ref <Decoder>
        masknet: !ref <MaskNet>
        source_predictor: !ref <SourcePredictor>
        target_encoder: !ref <TargetEncoder>
        lr_scheduler: !ref <lr_scheduler>
        counter: !ref <epoch_counter>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>
    precision: 2

# All separator modules are initialized from scratch for this experiment.
