# Generated 2026-10-16 from:
# /raid/home/lab/letuan/code/speechseparation/code/hparams/LibriMix/sepformer.yaml
# yamllint disable
# ################################
# Model: SepFormer for source separation
# https://arxiv.org/abs/2010.13154
# Dataset : WSJ0-2mix and WSJ0-3mix
# ################################
#
# Basic parameters
# Seed needs to be set at top of yaml, before objects with parameters are made
#
seed: 1234
__set_seed: !apply:torch.manual_seed [1234]

eval_only: false
dataset: librimix
librimix_train_split: train-100
librimix_version: min
librimix_validate_audio: false

# Data params

# Root containing wav8k/min/train-100, dev and test (e.g. Libri2Mix).

# e.g. '/yourpath/wsj0-mix/2speakers'
# end with 2speakers for wsj0-2mix or 3speakers for wsj0-3mix
data_folder: 
  /home/lab/letuan/code/speechseparation/data/LibriMix/storage/Libri2Mix

# The path for the original WSJ0 data; unused for static LibriMix.
base_folder_dm:

project: Mamba-TasNet
experiment: sepformer
output_folder: 
  /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234
train_log: 
  /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234/train_log.txt
save_folder: 
  /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234/save
train_data: 
  /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234/save/libri2mix_train-100.csv
valid_data: 
  /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234/save/libri2mix_dev.csv
test_data: 
  /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234/save/libri2mix_test.csv
skip_prep: false


# Experiment params
precision: true # bf16, fp16 or fp32 # Set it to True for mixed precision
num_spks: 2 # set to 3 for wsj0-3mix
noprogressbar: false
save_audio: true # Save estimated sources on disk
n_audio_to_save: 20
sample_rate: 8000

# Training parameters
N_epochs: 200
batch_size: 1
lr: 0.00015
clip_grad_norm: 5
loss_upper_lim: 999999  # this is the upper limit for an acceptable loss
# if True, the training sequences are cut to a specified length
limit_training_signal_len: false
# this is the length of sequences if we choose to limit
# the signal length of training sequences
training_signal_len: 32000

# Set it to True to dynamically create mixtures at training time
dynamic_mixing: false

# Parameters for data augmentation
use_wavedrop: false
use_speedperturb: true
use_rand_shift: false
min_shift: -8000
max_shift: 8000

# Speed perturbation
speed_changes: &id001 [95, 100, 105]

# Frequency drop: randomly drops a number of frequency bands to zero.
speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
  orig_freq: 8000
  speeds: *id001
drop_freq_low: 0  # Min frequency band dropout probability
drop_freq_high: 1  # Max frequency band dropout probability
drop_freq_count_low: 1  # Min number of frequency bands to drop
drop_freq_count_high: 3  # Max number of frequency bands to drop
drop_freq_width: 0.05  # Width of frequency bands to drop

drop_freq: !new:speechbrain.augment.time_domain.DropFreq
  drop_freq_low: 0
  drop_freq_high: 1
  drop_freq_count_low: 1
  drop_freq_count_high: 3
  drop_freq_width: 0.05

# Time drop: randomly drops a number of temporal chunks.
drop_chunk_count_low: 1  # Min number of audio chunks to drop
drop_chunk_count_high: 5  # Max number of audio chunks to drop
drop_chunk_length_low: 1000  # Min length of audio chunks to drop
drop_chunk_length_high: 2000  # Max length of audio chunks to drop

drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
  drop_length_low: 1000
  drop_length_high: 2000
  drop_count_low: 1
  drop_count_high: 5

# loss thresholding -- this thresholds the training loss
threshold_byloss: true
threshold: -30

# Encoder parameters
N_encoder_out: 256
out_channels: 256
kernel_size: 16
kernel_stride: 8

# Dataloader options
# Set num_workers: 0 on MacOS due to behavior of the multiprocessing library
dataloader_opts:
  batch_size: 1
  num_workers: 3


# Specifying the network
Encoder: &id004 !new:speechbrain.lobes.models.dual_path.Encoder
  kernel_size: 16
  out_channels: 256


SBtfintra: &id002 !new:speechbrain.lobes.models.dual_path.SBTransformerBlock
  num_layers: 8
  d_model: 256
  nhead: 8
  d_ffn: 1024
  dropout: 0
  use_positional_encoding: true
  norm_before: true

SBtfinter: &id003 !new:speechbrain.lobes.models.dual_path.SBTransformerBlock
  num_layers: 8
  d_model: 256
  nhead: 8
  d_ffn: 1024
  dropout: 0
  use_positional_encoding: true
  norm_before: true

MaskNet: &id008 !new:speechbrain.lobes.models.dual_path.Dual_Path_Model
  num_spks: 2
  in_channels: 256
  out_channels: 256
  num_layers: 2
  K: 250
  intra_model: *id002
  inter_model: *id003
  norm: ln
  linear_layer_after_inter_intra: false
  skip_around_intra: true

Decoder: &id007 !new:speechbrain.lobes.models.dual_path.Decoder
  in_channels: 256
  out_channels: 1
  kernel_size: 16
  stride: 8
  bias: false

# Training-only masked JEPA on the SepFormer encoder latents.
jepa_weight: 0.1
jepa_mask_ratio: 0.5
jepa_mask_span: 16
jepa_context_layers: 1
jepa_predictor_layers: 1
jepa_predictor_dim: 128
jepa_momentum: 0.996
jepa_momentum_end: 1.0
jepa_anneal_steps: 4000000
JEPAContext: &id005 !new:modules.transformer_blocks.JEPATransformerBlock
  num_layers: 1
  d_model: 256
  nhead: 8
  d_ffn: 1024
  dropout: 0
  use_positional_encoding: true
  norm_before: true
JEPAPredictor: &id006 !new:modules.transformer_blocks.JEPATransformerBlock
  num_layers: 1
  d_model: 128
  nhead: 8
  d_ffn: 512
  dropout: 0
  use_positional_encoding: true
  norm_before: true
JEPA: &id009 !new:modules.jepa.MaskedSourceJEPA

  encoder: *id004
  context_model: *id005
  predictor_model: *id006
  channels: 256
  predictor_dim: 128
  mask_ratio: 0.5
  mask_span: 16
  momentum: 0.996
  momentum_end: 1.0
  anneal_steps: 4000000

optimizer: !name:torch.optim.Adam
  lr: 0.00015
  weight_decay: 0

loss: !name:speechbrain.nnet.losses.get_si_snr_with_pitwrapper

lr_scheduler: !new:speechbrain.nnet.schedulers.ReduceLROnPlateau
  factor: 0.5
  patience: 2
  dont_halve_until_epoch: 85

epoch_counter: &id010 !new:speechbrain.utils.epoch_loop.EpochCounter
        #lr_scheduler: !ref <lr_scheduler>

  limit: 200

modules:
  encoder: *id004
  decoder: *id007
  masknet: *id008
  jepa: *id009
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: 
    /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234/save
  recoverables:
    encoder: *id004
    decoder: *id007
    masknet: *id008
    jepa: *id009
    counter: *id010
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
  save_file: 
    /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234/train_log.txt

use_wandb: true
resume: false
wandb_logger: !name:speechbrain.utils.train_logger.WandBLogger
  initializer: !name:wandb.init
  entity: xj-audio
  project: Mamba-TasNet
  name: sepformer
  dir: 
    /home/lab/letuan/code/speechseparation/code/results/LibriMix/sepformer_transformer_jepa/1234/save
  reinit: true
  resume: false

